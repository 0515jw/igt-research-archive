<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>녹색전환연구소 · 연구 아카이브</title>
<style>
*{box-sizing:border-box}
:root{--ink:#212124;--muted:#6a6a70;--lime:#d4ff9d;--lime-deep:#a6d85a;--line:#e9e9e9;--panel:#ffffff;--shadow:0 14px 40px rgba(0,0,0,.06)}
html,body{height:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:'Asta Sans','AstaSans','Pretendard','Noto Sans KR',sans-serif;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:999px;min-height:48px;padding:0 18px;cursor:pointer;touch-action:manipulation;white-space:nowrap;transition:.18s ease}
button[aria-pressed=true]{background:var(--lime);border-color:var(--lime);font-weight:700}
button:focus-visible{outline:3px solid #7da245;outline-offset:1px}
header{display:flex;align-items:center;justify-content:space-between;padding:clamp(12px,2.2vh,24px) 4vw;gap:12px;border-bottom:1px solid var(--line);flex-shrink:0}
header img{width:clamp(164px,23vw,270px);height:auto}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
main{flex:1;min-height:0;position:relative;overflow:hidden}
.view{height:100%;display:flex;flex-direction:column;min-height:0}
.hidden{display:none!important}
/* slide */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:3vw;padding:2vh 3vw;touch-action:pan-y}
.stage button.arrow{width:54px;height:54px;padding:0;font-size:30px;flex-shrink:0}
.book{height:100%;min-width:0;display:flex;justify-content:center;align-items:center;flex:1}
.book img{max-height:100%;max-width:100%;object-fit:contain;box-shadow:0 8px 30px rgba(0,0,0,.08);animation:appear .35s ease}
.side{flex:.6;height:58%;opacity:.62;cursor:pointer}
.side img{box-shadow:0 4px 18px rgba(0,0,0,.06)}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:8px 4vw 12px;flex-shrink:0;height:clamp(65px,14vh,110px);align-items:stretch;touch-action:pan-x}
.strip::-webkit-scrollbar{display:none}
.thumb{padding:4px;border-radius:6px;flex:0 0 auto;min-height:0;width:auto;border:2px solid transparent}
.thumb img{height:100%;width:auto;max-width:100px;object-fit:contain;display:block}
.thumb.active{border-color:#88b74d;background:var(--lime)}
/* 3D donut */
.wall{position:relative;display:flex;align-items:center;justify-content:center;padding:1.4vh 2.2vw 2.2vh;overflow:hidden;perspective:2100px;isolation:isolate;background:radial-gradient(circle at 50% 48%, #fcfef9 0, #fff 32%, #fff 100%)}
.ring-wrap{position:relative;width:min(95vw,1380px);height:min(76vh,860px);min-height:420px;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d}
.ring-wrap::before{content:'';position:absolute;inset:10% 7%;border-radius:50%;background:radial-gradient(ellipse at center, rgba(212,255,157,.18) 0 22%, rgba(212,255,157,0) 23% 100%);filter:blur(16px);pointer-events:none;z-index:0}
.ring-wrap::after{content:'';position:absolute;left:50%;top:50%;width:min(28vw,300px);height:min(28vw,300px);transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(0,0,0,.045);box-shadow:inset 0 0 0 12px rgba(255,255,255,.95), 0 18px 36px rgba(0,0,0,.04);background:radial-gradient(circle at 48% 36%, #fff 0, #fcfef9 62%, #f6faef 100%);z-index:1;pointer-events:none}
.ring-scene{position:absolute;inset:0;transform-style:preserve-3d;z-index:3}
.ring-guide{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%) rotateX(64deg);border:1px solid rgba(125,162,69,.08);box-shadow:0 0 0 1px rgba(255,255,255,.4) inset;pointer-events:none;z-index:0}
.ring-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;width:min(23vw,250px);max-width:78%;pointer-events:none}
.ring-kicker{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#f7fbf1;border:1px solid #edf5df;color:#6d8651;font-size:12px;font-weight:700}
.ring-title{margin-top:14px;font-size:clamp(25px,4vw,46px);font-weight:800;line-height:1}
.ring-sub{margin-top:10px;font-size:clamp(13px,1.7vw,16px);line-height:1.5;color:var(--muted)}
.ring-note{margin-top:16px;font-size:12px;color:#8a8a90}
.orbit-item{position:absolute;left:50%;top:50%;margin:0;padding:0;border:0;background:transparent;min-height:0;border-radius:10px;overflow:visible;transform-style:preserve-3d;transform-origin:center center;cursor:pointer;will-change:transform,opacity;transition:filter .18s ease}
.orbit-card{width:100%;height:100%;background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:6px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.08);backface-visibility:hidden}
.orbit-item img{display:block;width:100%;height:100%;object-fit:cover;background:#fff;backface-visibility:hidden}
.orbit-item:active .orbit-card{transform:scale(.98)}
.orbit-item.dim .orbit-card{filter:saturate(.88)}
.orbit-item.front .orbit-card{box-shadow:0 18px 40px rgba(0,0,0,.12)}
/* grid/modal */
.gridview{overflow:auto;padding:20px 4vw;display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:15px;align-content:start}
.gridview button{height:150px;border-radius:0;padding:4px}
.gridview img{width:100%;height:100%;object-fit:contain}
.modal{position:absolute;inset:0;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.1) blur(2px);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal img{max-height:100%;max-width:85%;object-fit:contain;box-shadow:0 10px 34px rgba(0,0,0,.12)}
.modal #close{position:absolute;right:18px;top:14px}
footer{display:flex;justify-content:space-between;align-items:center;padding:8px 4vw max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);gap:10px;flex-shrink:0;background:#fff}
footer div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
footer button{min-height:46px}
.count{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
@keyframes appear{from{opacity:.35;transform:translateX(12px)}to{opacity:1;transform:none}}
@media(max-height:520px){header{padding:7px 3vw}footer{padding:4px 3vw}button{min-height:44px;padding:0 12px}.stage{padding:1vh 2vw}.strip{height:62px}.ring-wrap{height:min(74vh,700px)}}
@media(max-width:760px){header img{width:145px}nav button{padding:0 10px;font-size:12px}.side{display:none}.stage{gap:6px}footer button{padding:0 12px;font-size:12px}.ring-center{width:min(52vw,240px)}.ring-wrap::after{width:min(46vw,240px);height:min(46vw,240px)}}
@media(prefers-reduced-motion:reduce){.book img{animation:none}}


/* QR is separate from the three-cover carousel. */
.qr-action{background:var(--lime);border-color:var(--lime);font-weight:700}
.modal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.58fr);align-items:center;gap:4vw;padding:66px 5vw 20px;background:#fff;backdrop-filter:none}
.modal #large{display:block;justify-self:center;width:100%;height:100%;max-width:100%;max-height:100%;min-width:0;min-height:0;object-fit:contain;box-shadow:none}
.qrpanel{position:static;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;min-width:0;min-height:0}
.qrpanel strong{font-size:clamp(15px,2vw,23px)}
.qrpanel small{font-size:clamp(12px,1.4vw,16px);color:#666;line-height:1.5}
.qrpanel a{color:inherit;font-size:14px;text-underline-offset:3px;padding:10px}
.modal .qrpanel .qrimage{position:static;display:block;width:min(100%,38vh,340px);height:auto;aspect-ratio:1;object-fit:contain;image-rendering:pixelated;box-shadow:none;background:#fff}
.modal #close{z-index:2;background:#fff}
@media(max-width:760px){.stage .side{display:flex;flex:.5;height:50%}.stage{gap:5px}.stage button.arrow{width:40px;height:44px}.qr-action{padding:0 10px}}
@media(max-height:520px){.modal{padding:52px 4vw 8px;gap:3vw}.qrpanel{gap:5px}.qrpanel a{padding:4px}}
</style>
</head>

  for (const k of ['slide','grid']) $(k).classList.toggle('hidden', k !== next);
  for (const [id, k] of [['s','slide'],['g','grid']]) $(id).setAttribute('aria-pressed', k === next);
  $('speed').classList.toggle('hidden', next !== 'slide'); $('slideZoom').classList.toggle('hidden', next !== 'slide');
  $('play').classList.toggle('hidden', next === 'grid');
  $('count').textContent = next === 'slide' ? `${idx+1} / ${N}` : `총 ${N}건`;
  resetSlide();

}
function openModal(i){ setQR("modal",i); modalOpen = true; $('large').src = paths[i]; $('modal').classList.remove('hidden'); resetSlide(); }
function closeModal(){ modalOpen = false; $('modal').classList.add('hidden'); resetSlide(); }

function buildBasics(){
  paths.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'thumb'; b.dataset.i = i; b.append(img(i)); b.onclick = () => select(i); $('strip').append(b);
    const g = document.createElement('button'); g.append(img(i)); g.onclick = () => openModal(i); $('grid').append(g);
  });
}

$('s').onclick = () => change('slide');
$('g').onclick = () => change('grid');
$('prev').onclick = $('left').onclick = () => select(idx-1);
$('next').onclick = $('right').onclick = () => select(idx+1);
$('center').onclick = $('slideZoom').onclick = () => openModal(idx); 
$('close').onclick = closeModal;
$('modal').onclick = e => { if (e.target === $('modal')) closeModal(); };
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Ⅱ 일시정지' : '▶ 재생'; resetSlide(); };
$('speed').onclick = () => { const arr = [2000,3000,5000,8000]; delay = arr[(arr.indexOf(delay)+1) % arr.length]; $('speed').textContent = delay/1000 + '초'; resetSlide(); };
$('full').onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    else alert('이 브라우저는 전체화면 버튼을 지원하지 않습니다. 브라우저 메뉴를 이용하세요.');
  } catch (e) { alert('브라우저에서 전체화면을 사용할 수 없습니다.'); }
};
let sx, sy;
$('stage').addEventListener('touchstart', e => { sx = e.changedTouches[0].clientX; sy = e.changedTouches[0].clientY; }, {passive:true});
$('stage').addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) select(idx + (dx < 0 ? 1 : -1)); }, {passive:true});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (!modalOpen && e.key === 'ArrowLeft') select(idx-1);
  if (!modalOpen && e.key === 'ArrowRight') select(idx+1);
  if (!modalOpen && e.code === 'Space' && !['BUTTON','A'].includes(document.activeElement.tagName)) { e.preventDefault(); $('play').click(); }
});
buildBasics();

renderSlide();
resetSlide();

</script>
</body>
</html>
